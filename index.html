<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Four Original Hero Sections</title>
<meta name="description" content="The four original uploaded hero sections presented at a consistent full-screen height with one unified scroll control." />
<style>
  :root{
    --control-bg:rgba(255,255,255,.88);
    --control-ink:#111;
    --control-border:rgba(15,18,24,.10);
    --control-shadow:0 12px 34px rgba(15,18,24,.14);
    --ease:cubic-bezier(.2,.75,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  button{font:inherit;color:inherit}

  .hero-deck{
    width:100%;height:100%;overflow-y:auto;overflow-x:hidden;
    scroll-snap-type:y mandatory;scroll-behavior:smooth;
    overscroll-behavior-y:contain;scrollbar-width:none;
  }
  .hero-deck::-webkit-scrollbar{display:none}
  .hero-slide{
    position:relative;width:100%;height:100svh;min-height:100svh;
    scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#fff;
  }
  .hero-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}

  /* One shared scroll control. The hero files themselves are otherwise unchanged. */
  .section-control{
    position:fixed;right:12px;top:50%;z-index:100;transform:translateY(-50%);
    padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;
    border-radius:999px;background:var(--control-bg);border:1px solid var(--control-border);
    box-shadow:var(--control-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:.48;transition:opacity .22s ease,transform .22s ease;
  }
  .section-control:hover,.section-control:focus-within{opacity:1;transform:translateY(-50%) translateX(-2px)}
  .section-arrow{
    width:28px;height:28px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;
    cursor:pointer;font-size:18px;line-height:1;transition:background .2s,transform .2s;
  }
  .section-arrow:hover{background:rgba(15,18,24,.07);transform:scale(1.06)}
  .section-arrow:disabled{opacity:.25;cursor:default;transform:none;background:transparent}
  .section-dots{display:flex;flex-direction:column;align-items:center;gap:7px}
  .section-dot{
    width:7px;height:7px;padding:0;border:0;border-radius:99px;background:rgba(15,18,24,.28);cursor:pointer;
    transition:height .25s var(--ease),background .25s var(--ease),transform .2s;
  }
  .section-dot:hover{transform:scale(1.25)}
  .section-dot.active{height:24px;background:#111}
  .section-count{font-size:9px;font-weight:800;letter-spacing:.02em;color:rgba(15,18,24,.5);writing-mode:vertical-rl;margin:2px 0}

  .loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:2;transition:.25s ease}
  .loading.hidden{opacity:0;visibility:hidden}
  .loading span{width:26px;height:26px;border-radius:50%;border:2px solid #ddd;border-top-color:#111;animation:spin .75s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:720px){
    .section-control{
      right:auto;top:auto;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
      flex-direction:row;padding:7px 10px;gap:7px;opacity:.8;
    }
    .section-control:hover,.section-control:focus-within{transform:translateX(-50%) translateY(-2px)}
    .section-dots{flex-direction:row}
    .section-dot.active{height:7px;width:24px}
    .section-count{writing-mode:horizontal-tb;margin:0 2px}
  }
  @media(prefers-reduced-motion:reduce){
    .hero-deck{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<main class="hero-deck" id="heroDeck" aria-label="Four original hero sections">
  <section class="hero-slide" data-index="0" data-title="Growth Hero">
    <div class="loading"><span></span></div>
    <iframe class="hero-frame" src="heroes/01-growth.html" title="Growth Hero" loading="eager"></iframe>
  </section>
  <section class="hero-slide" data-index="1" data-title="Teamwork Hero">
    <div class="loading"><span></span></div>
    <iframe class="hero-frame" src="heroes/02-teamwork.html" title="Teamwork Hero" loading="eager"></iframe>
  </section>
  <section class="hero-slide" data-index="2" data-title="Learn Anything Hero">
    <div class="loading"><span></span></div>
    <iframe class="hero-frame" src="heroes/03-learn-anything.html" title="Learn Anything Hero" loading="eager"></iframe>
  </section>
  <section class="hero-slide" data-index="3" data-title="LogicalMBA Hero">
    <div class="loading"><span></span></div>
    <iframe class="hero-frame" src="heroes/04-logicalmba.html" title="LogicalMBA Hero" loading="eager"></iframe>
  </section>
</main>

<nav class="section-control" aria-label="Hero section navigation">
  <button class="section-arrow" id="previousSection" aria-label="Previous hero section">↑</button>
  <div class="section-dots">
    <button class="section-dot active" data-index="0" aria-label="Go to Growth Hero"></button>
    <button class="section-dot" data-index="1" aria-label="Go to Teamwork Hero"></button>
    <button class="section-dot" data-index="2" aria-label="Go to Learn Anything Hero"></button>
    <button class="section-dot" data-index="3" aria-label="Go to LogicalMBA Hero"></button>
  </div>
  <div class="section-count"><span id="currentSection">01</span>/04</div>
  <button class="section-arrow" id="nextSection" aria-label="Next hero section">↓</button>
</nav>

<script>
(() => {
  const deck = document.getElementById('heroDeck');
  const slides = [...document.querySelectorAll('.hero-slide')];
  const frames = [...document.querySelectorAll('.hero-frame')];
  const dots = [...document.querySelectorAll('.section-dot')];
  const previous = document.getElementById('previousSection');
  const next = document.getElementById('nextSection');
  const counter = document.getElementById('currentSection');
  let activeIndex = 0;
  let wheelLocked = false;

  frames.forEach((frame,index) => {
    const hide = () => slides[index].querySelector('.loading')?.classList.add('hidden');
    frame.addEventListener('load', hide, {once:true});
    setTimeout(hide, 1400);
  });

  function update(index){
    activeIndex = Math.max(0,Math.min(index,slides.length-1));
    dots.forEach((dot,i) => dot.classList.toggle('active',i===activeIndex));
    counter.textContent = String(activeIndex+1).padStart(2,'0');
    previous.disabled = activeIndex === 0;
    next.disabled = activeIndex === slides.length-1;
  }

  function goTo(index,behavior='smooth'){
    const target = Math.max(0,Math.min(index,slides.length-1));
    slides[target].scrollIntoView({behavior,block:'start'});
    update(target);
  }

  previous.addEventListener('click',()=>goTo(activeIndex-1));
  next.addEventListener('click',()=>goTo(activeIndex+1));
  dots.forEach(dot=>dot.addEventListener('click',()=>goTo(Number(dot.dataset.index))));

  const observer = new IntersectionObserver(entries=>{
    const visible = entries.filter(entry=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(visible) update(Number(visible.target.dataset.index));
  },{root:deck,threshold:[.5,.7]});
  slides.forEach(slide=>observer.observe(slide));

  document.addEventListener('keydown',event=>{
    if(event.key==='ArrowDown'||event.key==='PageDown'){event.preventDefault();goTo(activeIndex+1)}
    if(event.key==='ArrowUp'||event.key==='PageUp'){event.preventDefault();goTo(activeIndex-1)}
    if(event.key==='Home'){event.preventDefault();goTo(0)}
    if(event.key==='End'){event.preventDefault();goTo(slides.length-1)}
  });

  deck.addEventListener('wheel',event=>{
    if(Math.abs(event.deltaY)<18||wheelLocked)return;
    event.preventDefault();
    wheelLocked=true;
    goTo(activeIndex+(event.deltaY>0?1:-1));
    setTimeout(()=>wheelLocked=false,780);
  },{passive:false});

  let touchStartY=0;
  deck.addEventListener('touchstart',event=>touchStartY=event.changedTouches[0].clientY,{passive:true});
  deck.addEventListener('touchend',event=>{
    const delta=touchStartY-event.changedTouches[0].clientY;
    if(Math.abs(delta)>55)goTo(activeIndex+(delta>0?1:-1));
  },{passive:true});

  update(0);
})();
</script>
</body>
</html>
