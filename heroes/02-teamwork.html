<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Embark India — Mentorship Hero</title>
<meta name="description" content="Grow with mentors who've been in your seat — Embark India mentorship." />
<style>
:root {
  --bg:#F4F7FC;
  --text:#0c0c0c;
  --muted:#444;
  --line:#6f6f6f;
  --lilac:#8FB0FF;
  --green:#5B8CFF;
  --white:#ffffff;
  --shadow:0 18px 50px rgba(0,0,0,.08);
  --ease:cubic-bezier(.2,.75,.2,1);
  --hero-h:min(100svh,820px);
  --headline-size:clamp(46px,5.15vw,87px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
button,input{font:inherit}
button{color:inherit}
.hero{position:relative;min-height:var(--hero-h);background:var(--bg);overflow:hidden;}
.canvas{max-width:1280px;height:100%;margin:0 auto;display:grid;grid-template-columns:minmax(420px,1.08fr) minmax(360px,.92fr);align-items:center;gap:20px;padding:48px 48px 34px;}
.left{position:relative;z-index:2;padding-left:10px;}
.headline{margin:0;line-height:.92;letter-spacing:-.06em;font-weight:430;font-size:var(--headline-size);max-width:620px;}
.headline .line{display:block;overflow:visible;}
.headline .line>span{display:inline-block;opacity:0;transform:translateY(24px);animation:textIn .8s var(--ease) forwards;}
.headline .line:nth-child(2)>span{animation-delay:.08s}
.headline .line:nth-child(3)>span{animation-delay:.16s}
.headline .line:nth-child(4)>span{animation-delay:.24s}
.o-ring{display:inline-grid;place-items:center;position:relative;min-width:.82em;}
.o-ring::before{content:"";position:absolute;inset:7% 10%;border-radius:50%;background:rgba(143,176,255,.65);transform:scale(.85);z-index:-1;box-shadow:inset 0 0 0 3px rgba(255,255,255,.72);}
.accent-bar{display:inline-flex;vertical-align:middle;margin-left:.17em;transform:translateY(-.1em);width:.92em;height:.23em;}
.accent-bar i{display:block;height:100%;}
.accent-bar .a{width:54%;background:var(--lilac);clip-path:polygon(0 0,85% 0,100% 100%,0 100%);}
.accent-bar .b{width:46%;background:#000;}
.cta-row{display:flex;align-items:center;gap:18px;margin-top:42px;opacity:0;transform:translateY(24px);animation:fadeUp .7s .4s var(--ease) forwards;}
.cta-main{display:inline-block;border:2px solid #111;background:#1D4ED8;color:#fff;text-decoration:none;padding:12px 24px;min-width:112px;box-shadow:-3px 3px 0 #000;font-weight:700;cursor:pointer;transition:.25s;}
.cta-main:hover{transform:translateY(-2px);box-shadow:-5px 5px 0 #000;}
.circle-btn{width:42px;height:42px;border-radius:50%;border:0;background:#000;color:#fff;display:grid;place-items:center;font-size:22px;cursor:pointer;transition:.25s}
.circle-btn:hover{transform:scale(1.06)}
.plain-arrow{display:grid;place-items:center;font-size:28px;font-weight:700;line-height:1;cursor:pointer;}
.bottom-link{display:flex;align-items:center;gap:18px;margin-top:72px;opacity:0;transform:translateY(24px);animation:fadeUp .7s .52s var(--ease) forwards;}
.people-strip{display:flex;align-items:stretch;border:2px solid #111;background:#fff;box-shadow:var(--shadow);overflow:hidden;}
.people-strip .mini{width:78px;height:78px;overflow:hidden;border-right:2px solid #111;cursor:default;position:relative;}
.people-strip .mini:last-child{border-right:0}
.people-strip img{width:100%;height:100%;object-fit:cover;display:block}
.mini-arrow{font-size:52px;line-height:1;font-weight:300;transform:translateY(-2px);}
.bottom-text{font-size:17px;line-height:1.15;font-weight:500;color:#2f2f2f;max-width:150px;}
.right{position:relative;display:flex;justify-content:center;align-items:center;min-height:620px;}
.mosaic{position:relative;width:min(92%,560px);height:560px;}
.tile{position:absolute;border:1.7px solid var(--line);background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transform:translateY(18px) scale(.98);animation:tileIn .65s var(--ease) forwards;box-shadow:0 2px 0 rgba(255,255,255,.35) inset;}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.dot-grid{background-image:radial-gradient(#d6d6d6 1.3px, transparent 1.3px);background-size:18px 18px;background-position:8px 10px;}
.tile.hi{font-size:60px;font-weight:450;letter-spacing:-.04em;background:transparent;animation:tileIn .65s .55s var(--ease) forwards, hiJump 1.6s 1.3s ease-in-out infinite;transform-origin:50% 80%;}
.tile01{background:linear-gradient(135deg, transparent 49.5%, #000 50%);}
.tile01 span{position:absolute;right:12px;bottom:6px;color:#fff;font-size:43px;letter-spacing:-.04em;font-weight:350;}
.tile.play svg{width:38px;height:38px;fill:#000;}
.tile.globe svg{width:58px;height:58px;stroke:#111;fill:none;stroke-width:2.3;}
.tile.arrow svg{width:48px;height:48px;stroke:#7b7b7b;fill:none;stroke-width:2.1;}
.tile.star svg{width:42px;height:42px;fill:#111;}
.tile.squiggle svg{width:100%;height:100%;stroke:#808080;fill:none;stroke-width:2.1;}
.tile.quad{display:grid;grid-template-columns:1fr .67fr;grid-template-rows:1fr 1fr;overflow:hidden;}
.tile.quad div{border-left:1.7px solid var(--line);border-top:1.7px solid var(--line);}
.tile.quad div:nth-child(1){grid-row:1/span 2;background:var(--green);border-top:0;border-left:0}
.tile.quad div:nth-child(2){background:#f6f6f6;border-top:0}
.tile.quad div:nth-child(3){background:#8FB0FF}
.tile.quad div:nth-child(4){display:none}
.tile.teamwork{left:188px;top:18px;width:120px;height:120px;animation-delay:.08s}
.tile.play{left:365px;top:62px;width:42px;height:42px;border:0;background:transparent;animation-delay:.18s}
.tile.quad{left:442px;top:18px;width:120px;height:120px;animation-delay:.22s}
.tile.arrow{left:68px;top:140px;width:120px;height:120px;animation-delay:.26s}
.tile.dot-grid{left:188px;top:140px;width:120px;height:120px;animation-delay:.30s}
.tile.squiggle{left:308px;top:140px;width:120px;height:120px;animation-delay:.34s}
.tile.globe{left:106px;top:305px;width:70px;height:70px;border:0;background:transparent;animation-delay:.38s}
.tile.photo-woman{left:188px;top:260px;width:120px;height:120px;animation-delay:.42s}
.tile.hi{left:336px;top:276px;width:94px;height:88px;border:0;animation-delay:.46s}
.tile.lilac{left:441px;top:316px;width:60px;height:60px;background:#8FB0FF;animation-delay:.50s}
.tile.star{left:128px;top:374px;width:60px;height:60px;background:#fff;animation-delay:.54s}
.tile.tile01{left:309px;top:374px;width:120px;height:120px;animation-delay:.58s}
@keyframes textIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes tileIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes hiJump{0%,100%{transform:translateY(0)}25%{transform:translateY(-10px)}50%{transform:translateY(0)}75%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (max-width: 1120px){
  .canvas{grid-template-columns:1fr;gap:30px;padding:36px 28px 28px;}
  .left{padding-left:0}
  .headline{max-width:680px}
  .right{min-height:540px}
  .mosaic{height:520px}
}
@media (max-width: 760px){
  :root{--headline-size:clamp(38px,10vw,60px)}
  .hero{min-height:auto}
  .canvas{padding:26px 18px 22px;}
  .cta-row{margin-top:28px;gap:12px;flex-wrap:wrap}
  .bottom-link{margin-top:44px;gap:12px;flex-wrap:wrap}
  .people-strip .mini{width:70px;height:70px}
  .right{min-height:420px}
  .mosaic{width:100%;height:360px;transform:scale(.74);transform-origin:top center;}
}
</style>
</head>
