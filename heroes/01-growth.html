<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Case Competitions Hero</title>
<meta name="description" content="Live case competitions with real companies — animated hero for EmbarkIndia." />
<style>
  :root {
    --page-bg:#F4F7FC;
    --ink:#070707;
    --muted:#555957;
    --sky:#8FB0FF;
    --lime:#5B8CFF;
    --navy:#0B1F3A;
    --button:#1D4ED8;
    --card:#ffffff;
    --shadow:0 20px 48px rgba(20,25,43,.15);
    --ease:cubic-bezier(.2,.75,.2,1);
    --hero-h:min(100svh,760px);
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--page-bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
  button,input,select{font:inherit}
  button{color:inherit}

  .hero{
    position:relative;
    width:100%;
    height:var(--hero-h);
    min-height:620px;
    overflow:hidden;
    isolation:isolate;
    background:var(--page-bg);
  }

  /* Large editable background forms */
  .shape{position:absolute;pointer-events:none;will-change:transform}
  .shape.sky{
    width:58vw;height:150%;left:38%;top:-40%;
    border-radius:50%;background:var(--sky);z-index:-3;
    animation:shapeIn 1.25s var(--ease) both, breathe 9s 1.4s ease-in-out infinite;
  }
  .shape.lime{
    width:55vw;height:150%;left:56.7%;top:-48%;
    border-radius:50%;background:var(--lime);z-index:-2;
    animation:shapeIn 1.25s .12s var(--ease) both, breathe 10s 1.6s ease-in-out infinite reverse;
  }
  .shape.navy{
    width:59vw;height:156%;left:74.2%;top:-48%;
    border-radius:50%;background:var(--navy);z-index:-1;
    animation:shapeIn 1.25s .23s var(--ease) both, breathe 11s 1.8s ease-in-out infinite;
  }

  .copy{
    position:absolute;left:clamp(34px,13.55vw,230px);top:50%;
    width:min(35vw,560px);transform:translateY(-50%);z-index:5;
  }
  .headline{
    margin:0;
    font-size:clamp(48px,4vw,67px);
    font-weight:430;
    letter-spacing:-.055em;
    line-height:.91;
    max-width:560px;
  }
  .headline .line{display:block;overflow:visible}
  .headline .line>span{display:inline-block;animation:textRise .78s var(--ease) both}
  .headline .line:nth-child(2)>span{animation-delay:.08s}
  .headline .line:nth-child(3)>span{animation-delay:.16s}
  .headline .line:nth-child(4)>span{animation-delay:.24s}

  .ringed{position:relative;display:inline-block;z-index:0}
  .ringed svg{position:absolute;left:-8%;top:-22%;width:118%;height:145%;overflow:visible;z-index:-1;pointer-events:none}
  .ringed path{
    fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;
    stroke-dasharray:590;stroke-dashoffset:590;
    animation:drawRing 1.15s .72s var(--ease) forwards;
  }
  .ringed path:nth-child(2){animation-delay:.84s;opacity:.9}

  .subtitle{
    margin:18px 0 0;
    max-width:390px;
    color:var(--muted);
    font-size:clamp(14px,1vw,16px);
    line-height:1.18;
    animation:fadeUp .7s .42s var(--ease) both;
  }
  .actions{display:flex;align-items:center;gap:18px;margin-top:34px;animation:fadeUp .7s .52s var(--ease) both}
  .join{
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
    min-width:110px;height:42px;padding:0 25px;border:0;border-radius:15px;background:var(--button);color:#fff;
    cursor:pointer;font-weight:650;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;
  }
  .join:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(29,78,216,.30)}
  .join::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.7),transparent 55%);transform:scale(0);opacity:0;transition:.45s}
  .join:active::after{transform:scale(2.3);opacity:1;transition:0s}

  .visual{position:absolute;inset:0;z-index:2;pointer-events:none}
  .device{
    position:absolute;left:57.1%;top:18.8%;bottom:0;width:21%;min-width:330px;max-width:355px;
    background:var(--card);border-radius:52px 52px 0 0;
    box-shadow:0 18px 55px rgba(27,29,55,.12);
    animation:deviceUp 1s .18s var(--ease) both;
    pointer-events:auto;
  }
  .photo{position:absolute;overflow:hidden;border-radius:13px;background:#ddd;cursor:default}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease),filter .35s}
  .photo:hover img{transform:scale(1.055)}
  .photo.top{width:52%;height:32.8%;left:30.3%;top:6.9%}
  .photo.bottom{width:54%;height:34.6%;left:11.6%;top:56.1%}

  .scribble{position:absolute;left:45%;top:45.5%;width:36%;height:21%;}
  .scribble path{fill:none;stroke:#1b1b1b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260;stroke-dashoffset:260;animation:scribble 1.3s 1s var(--ease) forwards}

  .float-card{
    position:absolute;background:#fff;border-radius:10px;box-shadow:var(--shadow);pointer-events:auto;
    animation:cardIn .78s var(--delay,.45s) var(--ease) both, float 5.2s calc(var(--delay, .45s) + .9s) ease-in-out infinite;
  }
  .friends{left:46.05%;top:36.9%;width:14.4%;min-width:235px;height:144px;padding:17px 31px}
  .friends h3{margin:0 0 22px;font-size:23px;font-weight:500;letter-spacing:-.03em;white-space:nowrap}
  .avatars{display:flex;align-items:center}
  .avatar{width:51px;height:51px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;margin-left:-10px;border:1px solid white;transition:transform .25s}
  .avatar:first-child{margin-left:0;background:#1D4ED8}
  .avatar:nth-child(2){background:#2E6BFF}
  .avatar:nth-child(3){background:#1740A8}
  .avatar:nth-child(4){background:#5B8CFF}
  .avatar:hover{transform:translateY(-5px) scale(1.05);z-index:3}

  .badge{height:82px;display:flex;align-items:center;gap:28px;padding:0 28px;white-space:nowrap}
  .badge.reward{left:72.1%;top:24.1%;width:16.4%;min-width:272px;--delay:.62s}
  .badge.live{left:72.6%;top:79.1%;width:15.9%;min-width:264px;height:68px;--delay:.78s}
  .badge svg{width:48px;height:48px;flex:0 0 48px}
  .badge.live svg{width:50px}
  .badge span{font-size:23px;letter-spacing:-.02em}

  .slider-nav{position:absolute;left:44.3%;bottom:16px;display:flex;align-items:center;gap:35px;z-index:7;animation:fadeUp .65s 1.05s var(--ease) both}
  .nav-arrow{border:0;background:transparent;font-size:45px;line-height:1;cursor:pointer;padding:0 4px;transition:transform .2s}
  .nav-arrow:hover{transform:scale(1.12)}
  .dots{display:flex;gap:6px}
  .dot{width:10px;height:10px;border:0;border-radius:50%;background:#999;padding:0;cursor:pointer;transition:.25s}
  .dot.active{background:#111;transform:scale(1.05)}

  @keyframes shapeIn{from{transform:scale(.75) translateY(-6%);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  @keyframes breathe{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,9px,0) scale(1.015)}}
  @keyframes textRise{from{opacity:0;transform:translateY(42px) rotate(2deg)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes drawRing{to{stroke-dashoffset:0}}
  @keyframes deviceUp{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
  @keyframes cardIn{from{opacity:0;transform:translateY(35px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
  @keyframes scribble{to{stroke-dashoffset:0}}

  @media (max-width:1100px){
    .copy{left:7vw;width:42vw}
    .headline{font-size:clamp(42px,5.3vw,58px)}
    .device{left:58%;width:29%;min-width:300px}
    .friends{left:47%;min-width:205px;width:20%;padding:18px 23px}
    .friends h3{font-size:20px}
    .avatar{width:44px;height:44px}
    .badge.reward,.badge.live{left:74%;min-width:220px}
    .badge{gap:16px;padding:0 18px}
    .badge span{font-size:19px}
  }

  @media (max-width:760px){
    :root{--hero-h:auto}
    .hero{height:auto;min-height:960px;overflow:hidden}
    .shape.sky{width:130vw;height:760px;left:12%;top:330px}
    .shape.lime{width:130vw;height:760px;left:42%;top:360px}
    .shape.navy{width:145vw;height:800px;left:77%;top:350px}
    .copy{position:relative;left:auto;top:auto;transform:none;width:auto;padding:86px 25px 0;z-index:9}
    .headline{font-size:clamp(43px,13.7vw,64px);max-width:610px}
    .subtitle{max-width:410px}
    .actions{margin-top:26px}
    .visual{position:relative;height:565px;margin-top:52px}
    .device{left:27%;top:0;bottom:0;width:55%;min-width:0;max-width:none}
    .friends{left:3%;top:20%;width:48%;min-width:0;height:125px;padding:15px 18px}
    .friends h3{font-size:18px;margin-bottom:18px}
    .avatar{width:39px;height:39px;font-size:12px}
    .badge.reward{left:52%;top:8%;width:45%;min-width:0;height:68px}
    .badge.live{left:52%;top:77%;width:45%;min-width:0;height:62px}
    .badge{gap:8px;padding:0 13px}
    .badge svg{width:37px;height:37px;flex-basis:37px}
    .badge span{font-size:16px}
    .slider-nav{left:50%;bottom:8px;transform:translateX(-50%);gap:25px}
    .nav-arrow{font-size:38px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<script>
(() => {
  const hero = document.getElementById('hero');

  // Hero slider dots + arrows (visual accent only)
  const dots = [...document.querySelectorAll('.dot')];
  let slide = 0;
  const showSlide = n => {
    slide = (n + dots.length) % dots.length;
    dots.forEach((d,i) => d.classList.toggle('active',i===slide));
    hero.animate([
      {filter:'brightness(1)', transform:'translateX(0)'},
      {filter:'brightness(.97)', transform:`translateX(${slide%2 ? -3 : 3}px)`},
      {filter:'brightness(1)', transform:'translateX(0)'}
    ],{duration:520,easing:'ease-out'});
  };
  dots.forEach((d,i) => d.addEventListener('click', () => showSlide(i)));
  document.getElementById('prevSlide').addEventListener('click', () => showSlide(slide-1));
  document.getElementById('nextSlide').addEventListener('click', () => showSlide(slide+1));
})();
</script>
